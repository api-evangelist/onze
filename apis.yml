name: Onze
description: >-
  Onze is a Brazilian fintech (São Paulo) focused on corporate private pension
  (previdência privada) and financial health for companies and their employees.
  It offers digital management of employer-sponsored pension plans, access to
  more than 300 investment funds, one-on-one financial consultations with
  specialists, and financial-education seminars, all delivered as a B2B employee
  benefits platform. Onze positions itself as the first fintech centered on
  pension and financial wellness for a company's collaborators, and is backed by
  Ribbit Capital. This profile was added to the API Evangelist network as a
  portfolio-lead stub; as of this enrichment pass Onze publishes no public
  developer portal, API reference, or machine-readable API surface.
